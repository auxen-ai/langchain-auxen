[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-auxen"
version = "0.1.0"
description = "LangChain provider for Auxen — private AI models on dedicated GPUs, OpenAI-compatible, pay-per-minute."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Auxen", email = "hello@auxen.ai" }
]
keywords = ["ai", "llm", "langchain", "auxen", "openai", "inference", "llama", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://auxen.ai"
Documentation = "https://auxen.ai/docs"
Repository = "https://github.com/auxen-ai/langchain-auxen"
Issues = "https://github.com/auxen-ai/langchain-auxen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_auxen"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_auxen", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
